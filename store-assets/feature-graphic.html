<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Amiri; src: url('../public/assets/fonts/Amiri-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: Amiri; src: url('../public/assets/fonts/Amiri-Regular.ttf'); font-weight: 400; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 78% 30%, #1a8572 0%, #0f6b5c 45%, #0b4f44 100%);
    color: #f7f5f0; font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: space-between; padding: 0 72px; box-sizing: border-box;
  }
  .text { direction: rtl; text-align: right; }
  h1 { font-family: Amiri; font-weight: 700; font-size: 92px; margin: 0; line-height: 1.1; color: #e0b66a; }
  .en { direction: ltr; text-align: right; font-size: 34px; font-weight: 600; letter-spacing: 0.5px; margin-top: 4px; }
  .tag { font-family: Amiri; font-size: 34px; margin-top: 22px; opacity: 0.95; }
  .tag-en { direction: ltr; text-align: right; font-size: 22px; opacity: 0.85; margin-top: 6px; }
  img { width: 300px; height: 300px; border-radius: 64px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
</style>
</head>
<body>
  <img src="icon.svg" alt="">
  <div class="text">
    <h1>رفيق المسلم</h1>
    <div class="en">Muslim Friend</div>
    <div class="tag">أذكار بمصادرها · بلا إعلانات · دون إنترنت</div>
    <div class="tag-en">Sourced athkar · No ads · Works offline</div>
  </div>
</body>
</html>
