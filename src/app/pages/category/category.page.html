<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" [text]="''" [attr.aria-label]="'common.back' | translate" />
    </ion-buttons>
    <ion-title>{{ title() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="reordering.set(!reordering())"
                  [attr.aria-pressed]="reordering()"
                  [attr.aria-label]="(reordering() ? 'common.finishReorder' : 'common.reorder') | translate">
        <ion-icon slot="icon-only" [name]="reordering() ? 'checkmark-circle' : 'reorder-three-outline'" aria-hidden="true" />
      </ion-button>
      <ion-button (click)="resetToday()" [attr.aria-label]="'category.resetToday' | translate">
        <ion-icon slot="icon-only" name="refresh-outline" aria-hidden="true" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (reordering()) {
    <p class="hint">{{ 'category.reorderHint' | translate }}</p>
  }
  <ion-list>
    <ion-reorder-group [disabled]="!reordering()" (ionReorderEnd)="onReorder($event)">
      @for (d of items(); track d.id; let i = $index) {
        <ion-item [button]="!reordering()" [detail]="false" (click)="open(i)">
          <ion-label class="ion-text-wrap">
            <p class="preview" lang="ar" dir="rtl">{{ preview(d) }}</p>
            <ion-note>{{ d.sourceRef }}</ion-note>
          </ion-label>
          <ion-note slot="end" class="count" [class.done]="countOf(d) >= d.repeatCount"
                    [attr.aria-label]="'category.itemProgress' | translate: { count: countOf(d), total: d.repeatCount }">
            {{ countOf(d) }}/{{ d.repeatCount }}
          </ion-note>
          <ion-reorder slot="end" />
        </ion-item>
      }
    </ion-reorder-group>
  </ion-list>
</ion-content>

<ion-footer class="ion-padding">
  <ion-button expand="block" (click)="open(0)" [disabled]="!items().length || reordering()">
    {{ 'category.start' | translate }}
  </ion-button>
</ion-footer>
